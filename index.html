<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="newChatBtn" class="topbar-btn" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="topbar-btn-label">New chat</span>
      </button>
      <h1 class="title">AI Chat</h1>
      <button id="settingsBtn" class="topbar-btn icon" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <main id="thread" class="thread" aria-live="polite"></main>

    <div id="emptyState" class="empty-state">
      <h2>What can I do for you?</h2>
      <div class="chips">
        <button class="chip" data-suggest="Explain like I'm 15: how do neural networks learn?">Explain like I'm 15: how do neural networks learn?</button>
        <button class="chip" data-suggest="Write a haiku about the ocean">Write a haiku about the ocean</button>
        <button class="chip" data-suggest="Give me 5 dinner ideas under 20 minutes">Give me 5 dinner ideas under 20 minutes</button>
      </div>
    </div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="Message AI Chat…" aria-label="Message"></textarea>
      <button id="sendBtn" class="send-btn" title="Send" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </footer>

    <div id="settingsModal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">Settings</h2>
        <label class="field">
          <span>API key</span>
          <input type="password" id="apiKey" autocomplete="off" placeholder="sk-…" />
        </label>
        <label class="field">
          <span>Base URL</span>
          <input type="text" id="baseUrl" inputmode="url" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span>Model</span>
          <input type="text" id="model" placeholder="gpt-4o-mini" />
        </label>
        <label class="field">
          <span>System prompt</span>
          <textarea id="systemPrompt" rows="3"></textarea>
        </label>
        <p class="note">Your key is stored only in this browser's localStorage and is sent only to the Base URL above — nowhere else.</p>
        <div class="modal-actions">
          <button id="cancelSettings" class="btn secondary">Cancel</button>
          <button id="saveSettings" class="btn primary">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
